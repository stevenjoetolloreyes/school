<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/fa/css/all.min.css">
<link rel="icon" type="image/webp" href="icon.webp">
<title>Students · Student Attendance Monitor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1c2333; --muted:#6b768c; --line:#e6eaf2;
    --blue:#2563eb; --blue-dark:#1e40af; --green:#16a34a; --green-bg:#dcfce7;
    --orange:#d97706; --orange-bg:#fef3c7; --red:#dc2626; --red-bg:#fee2e2;
    --sidebar:#101828; --sidebar-ink:#cbd5e1;
  }
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  a{text-decoration:none;color:inherit}
  button{font-family:inherit;cursor:pointer}

  .sidebar{width:240px;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20;transition:transform .25s}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand-badge{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:20px}
  .brand h1{font-size:15px;color:#fff;line-height:1.2}
  .brand small{font-size:11px;color:#94a3b8}
  .nav{padding:14px 10px;display:flex;flex-direction:column;gap:4px}
  .nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;font-size:14px;color:var(--sidebar-ink)}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.active{background:var(--blue);color:#fff;font-weight:600}
  .nav .ico{width:20px;text-align:center}
  .sidebar-foot{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#94a3b8}

  .main{flex:1;margin-left:240px;padding:22px;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .topbar h2{font-size:22px}
  .topbar .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .burger{display:none;background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:18px}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-dark)}
  .btn-light{background:var(--card);border:1px solid var(--line);color:var(--ink)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:220px;flex:1;max-width:340px}
  .search input{border:none;outline:none;font-size:14px;width:100%;background:transparent;color:var(--ink)}
  select.filter{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--card);color:var(--ink)}
  .count{margin-left:auto;font-size:13px;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .stu{display:flex;align-items:center;gap:10px;font-weight:600}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:0 0 32px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .b-active{background:var(--green-bg);color:var(--green)}
  .b-inactive{background:var(--red-bg);color:var(--red)}
  .act{display:flex;gap:6px}
  .icon-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:12px}
  .icon-btn:hover{border-color:var(--blue);color:var(--blue)}
  .icon-btn.danger:hover{border-color:var(--red);color:var(--red)}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .overlay.show{display:flex}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:430px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal h3{font-size:17px;margin-bottom:4px}
  .modal .hint{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:var(--card);color:var(--ink)}
  .field input:focus,.field select:focus{border-color:var(--blue)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

  @media (max-width:760px){
    .sidebar{transform:translateX(-100%)} .sidebar.open{transform:none}
    .main{margin-left:0;padding:16px} .burger{display:block}
    .count{margin-left:0;width:100%}
    th:nth-child(4),td:nth-child(4){display:none}
  }
  .nav .ico i{font-size:14px} .brand-badge i{font-size:18px;color:#fff} .ic i{font-size:20px} .search i{font-size:13px;color:var(--muted)} .icon-btn i{margin-right:4px}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-badge"><i class="fa-solid fa-graduation-cap"></i></div>
    <div>
      <h1>Attendance Monitor</h1>
      <small>Student Monitoring System</small>
    </div>
  </div>
  <nav class="nav">
    <a href="index.html"><span class="ico"><i class="fa-solid fa-gauge"></i></span> Dashboard</a>
    <a href="students.html" class="active"><span class="ico"><i class="fa-solid fa-user-graduate"></i></span> Students</a>
    <a href="attendance.html"><span class="ico"><i class="fa-solid fa-clipboard-check"></i></span> Attendance</a>
    <a href="#"><span class="ico"><i class="fa-solid fa-file-lines"></i></span> Reports</a>
    <a href="#"><span class="ico"><i class="fa-solid fa-gear"></i></span> Settings</a>
    <a href="#"><span class="ico"><i class="fa-solid fa-right-from-bracket"></i></span> Logout</a>
  </nav>
  <div class="sidebar-foot">School Year 2026–2027<br>First Semester</div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="burger" id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <div>
      <h2>Students</h2>
      <div class="sub">Manage student records</div>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Add Student</button>
  </div>

  <section class="panel">
    <div class="toolbar">
      <label class="search"><i class="fa-solid fa-magnifying-glass"></i> <input type="text" id="search" placeholder="Search by name or ID..."></label>
      <select class="filter" id="sectionFilter">
        <option value="">All Sections</option>
        <option>BSIT 1-A</option>
        <option>BSIT 1-B</option>
      </select>
      <div class="count" id="count"></div>
    </div>

    <table>
      <thead><tr><th>Student</th><th>Student ID</th><th>Section</th><th>Gender</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No students found.</div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add Student</h3>
    <div class="hint">Fill in the student information below.</div>
    <form id="form">
      <div class="field"><label>Full Name</label><input type="text" id="fName" placeholder="e.g. Juan Dela Rosa" required></div>
      <div class="field"><label>Student ID</label><input type="text" id="fId" placeholder="e.g. 2026-0009" required></div>
      <div class="field"><label>Section</label>
        <select id="fSection"><option>BSIT 1-A</option><option>BSIT 1-B</option></select>
      </div>
      <div class="field"><label>Gender</label>
        <select id="fGender"><option>Male</option><option>Female</option></select>
      </div>
      <div class="field"><label>Status</label>
        <select id="fStatus"><option>Active</option><option>Inactive</option></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-light" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Student</button>
      </div>
    </form>
  </div>
</div>

<script>
  var students = [
    { name:'Juan Dela Rosa',  id:'2026-0001', section:'BSIT 1-A', gender:'Male',   status:'Active' },
    { name:'Maria Santos',    id:'2026-0002', section:'BSIT 1-A', gender:'Female', status:'Active' },
    { name:'Jose Dela Cruz',  id:'2026-0003', section:'BSIT 1-A', gender:'Male',   status:'Active' },
    { name:'Ana Reyes',       id:'2026-0004', section:'BSIT 1-A', gender:'Female', status:'Active' },
    { name:'Mark Garcia',     id:'2026-0005', section:'BSIT 1-A', gender:'Male',   status:'Active' },
    { name:'Kristine Lopez',  id:'2026-0006', section:'BSIT 1-A', gender:'Female', status:'Active' },
    { name:'Ramon Bautista',  id:'2026-0007', section:'BSIT 1-A', gender:'Male',   status:'Active' },
    { name:'Jenny Torres',    id:'2026-0008', section:'BSIT 1-A', gender:'Female', status:'Active' },
    { name:'Carlo Mendoza',   id:'2026-0101', section:'BSIT 1-B', gender:'Male',   status:'Active' },
    { name:'Rica Fernandez',  id:'2026-0102', section:'BSIT 1-B', gender:'Female', status:'Active' },
    { name:'Paolo Aquino',    id:'2026-0103', section:'BSIT 1-B', gender:'Male',   status:'Inactive' },
    { name:'Shaira Villanueva', id:'2026-0104', section:'BSIT 1-B', gender:'Female', status:'Active' }
  ];
  var editIndex = -1;

  function initials(name){
    return name.split(' ').map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase();
  }

  function render(){
    var q = document.getElementById('search').value.toLowerCase();
    var sec = document.getElementById('sectionFilter').value;
    var tbody = document.getElementById('rows');
    var shown = 0;
    tbody.innerHTML = '';
    students.forEach(function(s, i){
      if (q && (s.name.toLowerCase().indexOf(q) === -1 && s.id.toLowerCase().indexOf(q) === -1)) return;
      if (sec && s.section !== sec) return;
      shown++;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><div class="stu"><div class="avatar">' + initials(s.name) + '</div>' + s.name + '</div></td>' +
        '<td>' + s.id + '</td><td>' + s.section + '</td><td>' + s.gender + '</td>' +
        '<td><span class="badge ' + (s.status === 'Active' ? 'b-active' : 'b-inactive') + '">' + s.status + '</span></td>' +
        '<td><div class="act">' +
          '<button class="icon-btn" data-edit="' + i + '"><i class="fa-solid fa-pen"></i> Edit</button>' +
          '<button class="icon-btn danger" data-del="' + i + '"><i class="fa-solid fa-trash"></i> Delete</button>' +
        '</div></td>';
      tbody.appendChild(tr);
    });
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
    document.getElementById('count').textContent = 'Showing ' + shown + ' of ' + students.length + ' students';
  }

  // Search + filter
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('sectionFilter').addEventListener('change', render);

  // Modal open/close
  var overlay = document.getElementById('overlay');
  function openModal(title){
    document.getElementById('modalTitle').textContent = title;
    overlay.classList.add('show');
  }
  function closeModal(){ overlay.classList.remove('show'); editIndex = -1; document.getElementById('form').reset(); }
  document.getElementById('addBtn').addEventListener('click', function(){ openModal('Add Student'); });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });

  // Add / Edit (event delegation for the row buttons)
  document.getElementById('rows').addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit]');
    var delBtn = e.target.closest('[data-del]');
    if (editBtn){
      editIndex = +editBtn.getAttribute('data-edit');
      var s = students[editIndex];
      document.getElementById('fName').value = s.name;
      document.getElementById('fId').value = s.id;
      document.getElementById('fSection').value = s.section;
      document.getElementById('fGender').value = s.gender;
      document.getElementById('fStatus').value = s.status;
      openModal('Edit Student');
    }
    if (delBtn){
      var i = +delBtn.getAttribute('data-del');
      if (confirm('Delete ' + students[i].name + '?')) { students.splice(i, 1); render(); }
    }
  });

  // Save
  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    var data = {
      name: document.getElementById('fName').value.trim(),
      id: document.getElementById('fId').value.trim(),
      section: document.getElementById('fSection').value,
      gender: document.getElementById('fGender').value,
      status: document.getElementById('fStatus').value
    };
    if (!data.name || !data.id) return;
    if (editIndex >= 0) students[editIndex] = data; else students.push(data);
    closeModal();
    render();
  });

  // Mobile sidebar
  document.getElementById('burger').addEventListener('click', function(){
    document.getElementById('sidebar').classList.toggle('open');
  });

  render();
</script>
</body>
</html>
