<title>My Attendance · Student Attendance Monitor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--muted:#6b768c;--line:#e6eaf2;--blue:#2563eb;--blue-dark:#1e40af;--green:#16a34a;--green-bg:#dcfce7;--orange:#d97706;--orange-bg:#fef3c7;--red:#dc2626;--red-bg:#fee2e2}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  a{text-decoration:none;color:inherit}
  .topbar{display:flex;align-items:center;gap:10px;padding:18px 22px;max-width:980px;margin:0 auto}
  .topbar .badge-ic{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  .topbar b{font-size:16px;display:block;line-height:1.1}
  .topbar small{font-size:11px;color:var(--muted)}
  .spacer{flex:1}
  .logout{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
  .wrap{max-width:980px;margin:0 auto;padding:10px 22px 40px}
  .profile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex:0 0 64px}
  .profile h1{font-size:22px}
  .profile p{color:var(--muted);font-size:13px;margin-top:2px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;margin-top:8px}
  .b-active{background:var(--green-bg);color:var(--green)}
  .b-inactive{background:var(--red-bg);color:var(--red)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card small{color:var(--muted);font-size:12px;display:block}
  .card b{font-size:26px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .panel h3{font-size:15px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:10px 6px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .b-present{background:var(--green-bg);color:var(--green)}
  .b-late{background:var(--orange-bg);color:var(--orange)}
  .b-absent{background:var(--red-bg);color:var(--red)}
  .notice{background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:16px;font-size:14px}
  label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
  select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
  .btn{display:inline-block;margin-top:14px;padding:11px 18px;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
  .note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
  @media (max-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="badge-ic"><i class="fa-solid fa-graduation-cap"></i></div>
    <div><b>Student Attendance Monitor</b><small>My Attendance</small></div>
    <div class="spacer"></div>
    <a class="logout" href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </header>
  <main class="wrap" id="content"></main>
<script>
  var students = [{"name": "Juan Dela Rosa", "id": "2026-0001", "section": "BSIT 1-A", "gender": "Male", "status": "Active"}, {"name": "Maria Santos", "id": "2026-0002", "section": "BSIT 1-A", "gender": "Female", "status": "Active"}, {"name": "Jose Dela Cruz", "id": "2026-0003", "section": "BSIT 1-A", "gender": "Male", "status": "Active"}, {"name": "Ana Reyes", "id": "2026-0004", "section": "BSIT 1-A", "gender": "Female", "status": "Active"}, {"name": "Mark Garcia", "id": "2026-0005", "section": "BSIT 1-A", "gender": "Male", "status": "Active"}, {"name": "Kristine Lopez", "id": "2026-0006", "section": "BSIT 1-A", "gender": "Female", "status": "Active"}, {"name": "Ramon Bautista", "id": "2026-0007", "section": "BSIT 1-A", "gender": "Male", "status": "Active"}, {"name": "Jenny Torres", "id": "2026-0008", "section": "BSIT 1-A", "gender": "Female", "status": "Active"}, {"name": "Carlo Mendoza", "id": "2026-0101", "section": "BSIT 1-B", "gender": "Male", "status": "Active"}, {"name": "Rica Fernandez", "id": "2026-0102", "section": "BSIT 1-B", "gender": "Female", "status": "Active"}, {"name": "Paolo Aquino", "id": "2026-0103", "section": "BSIT 1-B", "gender": "Male", "status": "Inactive"}, {"name": "Shaira Villanueva", "id": "2026-0104", "section": "BSIT 1-B", "gender": "Female", "status": "Active"}];
  var week = {"2026-0001": [["Present", "7:12 AM"], ["Present", "7:08 AM"], ["Present", "7:15 AM"], ["Present", "7:10 AM"], ["Present", "7:12 AM"]], "2026-0002": [["Present", "7:05 AM"], ["Present", "7:03 AM"], ["Present", "7:06 AM"], ["Present", "7:04 AM"], ["Present", "7:05 AM"]], "2026-0003": [["Present", "7:20 AM"], ["Present", "7:18 AM"], ["Late", "7:41 AM"], ["Present", "7:22 AM"], ["Late", "7:41 AM"]], "2026-0004": [["Present", "7:18 AM"], ["Present", "7:16 AM"], ["Present", "7:19 AM"], ["Present", "7:17 AM"], ["Present", "7:18 AM"]], "2026-0005": [["Present", "7:30 AM"], ["Present", "7:28 AM"], ["Absent", "\u2014"], ["Present", "7:29 AM"], ["Absent", "\u2014"]], "2026-0006": [["Present", "7:26 AM"], ["Present", "7:24 AM"], ["Present", "7:27 AM"], ["Present", "7:25 AM"], ["Present", "7:26 AM"]], "2026-0007": [["Present", "7:35 AM"], ["Late", "7:52 AM"], ["Present", "7:33 AM"], ["Present", "7:36 AM"], ["Late", "7:52 AM"]], "2026-0008": [["Present", "7:09 AM"], ["Present", "7:07 AM"], ["Present", "7:10 AM"], ["Present", "7:08 AM"], ["Present", "7:09 AM"]], "2026-0101": [["Present", "8:00 AM"], ["Present", "7:58 AM"], ["Present", "8:02 AM"], ["Present", "7:59 AM"], ["Present", "8:00 AM"]], "2026-0102": [["Present", "8:05 AM"], ["Present", "8:03 AM"], ["Late", "8:12 AM"], ["Present", "8:04 AM"], ["Present", "8:05 AM"]], "2026-0103": [["Present", "8:10 AM"], ["Absent", "\u2014"], ["Present", "8:09 AM"], ["Present", "8:11 AM"], ["Present", "8:10 AM"]], "2026-0104": [["Present", "8:07 AM"], ["Present", "8:06 AM"], ["Present", "8:08 AM"], ["Present", "8:05 AM"], ["Present", "8:07 AM"]]};
  var days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var s = null;
  students.forEach(function(x){ if (x.id === id) s = x; });
  var content = document.getElementById('content');
  function initials(name){ return name.split(' ').map(function(w){ return w[0]; }).slice(0, 2).join('').toUpperCase(); }
  function badgeCls(st){ return st === 'Present' ? 'b-present' : (st === 'Late' ? 'b-late' : 'b-absent'); }
  if (!s) {
    var opts = students.map(function(x){
      return '<option value="' + x.id + '">' + x.name + ' &mdash; ' + x.id + ' (' + x.section + ')</option>';
    }).join('');
    content.innerHTML =
      '<div class="notice"><b>Student not found.</b> Pumili ng student mula sa listahan para makita ang sarili mong attendance.</div>' +
      '<div class="panel" style="margin-top:16px"><label for="pick">Select student</label>' +
      '<select id="pick">' + opts + '</select>' +
      '<button class="btn" id="go">View My Attendance</button></div>';
    document.getElementById('go').addEventListener('click', function(){
      window.location.href = 'student.html?id=' + encodeURIComponent(document.getElementById('pick').value);
    });
  } else {
    var w = week[s.id];
    // If the teacher saved today's marks in this browser, use them for Friday (today).
    try {
      var today = new Date().toISOString().slice(0, 10);
      var saved = JSON.parse(localStorage.getItem('attendance-' + today) || 'null');
      if (saved && saved[s.id]) { w = w.slice(); w[4] = [saved[s.id], saved[s.id] === 'Absent' ? '—' : w[4][1]]; }
    } catch (e) {}
    var p = 0, l = 0, a = 0;
    w.forEach(function(r){ if (r[0] === 'Present') p++; else if (r[0] === 'Late') l++; else a++; });
    var rows = w.map(function(r, i){
      return '<tr><td>' + days[i] + '</td><td>' + r[1] + '</td><td><span class="badge ' + badgeCls(r[0]) + '">' + r[0] + '</span></td></tr>';
    }).join('');
    var rate = Math.round(p / w.length * 100);
    content.innerHTML =
      '<section class="profile"><div class="avatar">' + initials(s.name) + '</div>' +
      '<div><h1>' + s.name + '</h1><p>' + s.id + ' &middot; ' + s.section + ' &middot; ' + s.gender + '</p>' +
      '<span class="badge ' + (s.status === 'Active' ? 'b-active' : 'b-inactive') + '">' + s.status + '</span></div></section>' +
      '<section class="cards">' +
      '<div class="card"><small>Attendance rate (this week)</small><b>' + rate + '%</b></div>' +
      '<div class="card"><small>Present</small><b>' + p + '</b></div>' +
      '<div class="card"><small>Late</small><b>' + l + '</b></div>' +
      '<div class="card"><small>Absent</small><b>' + a + '</b></div></section>' +
      '<section class="panel"><h3>My Attendance &mdash; This Week (Sample)</h3>' +
      '<table><tr><th>Day</th><th>Time In</th><th>Status</th></tr>' + rows + '</table>' +
      '<p class="note">This is your record only. Other students cannot see it from this page. ' +
      'Sample week data &mdash; saved marks from the Attendance page appear here for today when saved in this browser.</p></section>';
  }
</script>
</body>
</html>
